<!doctype html><style>
body{margin:0;font:14px sans-serif}
.a{inline-size:200px;block-size:40px;background:#cdf;padding-inline:10px;margin-block:6px}
.b{max-inline-size:120px;min-block-size:50px;background:#fcd;margin-inline-start:30px}
.c{border-inline:4px solid #36c;border-block:2px solid #36c;inline-size:150px;margin-block-start:6px}
.d{border-inline-start:6px solid #393;border-block-end:6px solid #393;inline-size:150px;margin-block:6px}
.e{position:relative;height:60px;background:#eee}.f{position:absolute;inset-inline:40px 200px;inset-block:10px;background:#fd8}
</style>
<div class=a>inline-size</div><div class=b>max-inline-size wraps this text</div><div class=c>border sides</div><div class=d>border start</div>
<div class=e><div class=f>inset-inline</div></div>
