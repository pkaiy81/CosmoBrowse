<html>
<head>
<style>
  body { font-size: 16px; }
  .plain { list-style: none; padding: 0; background-color: #eef; }
  .squares { list-style-type: square; }
</style>
</head>
<body>
  <ul>
    <li>disc one</li>
    <li>disc two</li>
  </ul>
  <ol>
    <li>first</li>
    <li>second</li>
    <li>third</li>
  </ol>
  <ul class="squares">
    <li>square item</li>
  </ul>
  <ul class="plain">
    <li>reset: no marker, no indent</li>
  </ul>
</body>
</html>
