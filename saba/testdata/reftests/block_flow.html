<html>
<head>
<style>
  body { background-color: #fafafa; color: #222222; }
  h1 { color: #003366; }
  .box { width: 400px; background-color: #dde8ff; padding: 12px; margin: 8px; border-width: 2px; border-color: #3355aa; }
  .accent { background-color: #ffe0cc; }
  p { margin: 6px; }
</style>
</head>
<body>
  <h1>Block flow</h1>
  <div class="box">
    <p>First paragraph inside a fixed-width box with padding and border.</p>
    <p class="accent">Second paragraph with its own background.</p>
  </div>
  <div class="box accent">
    <h2>Nested heading</h2>
    <ul>
      <li>list item one</li>
      <li>list item two</li>
      <li>list item three</li>
    </ul>
  </div>
  <blockquote>Blockquote text sits indented under the boxes.</blockquote>
  <hr>
  <pre>preformatted   spacing
second line</pre>
</body>
</html>
