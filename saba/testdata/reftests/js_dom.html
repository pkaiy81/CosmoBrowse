<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; font-family: sans-serif; background: #ffffff; }
  h1 { background: #2d5fa0; color: #ffffff; margin: 0; padding: 16px; font-size: 24px; }
  #list { list-style: none; margin: 0; padding: 16px; }
  #list li { background: #eef3fb; color: #12233a; margin: 0 0 8px 0; padding: 12px 16px; border-radius: 6px; font-size: 18px; }
  #list li.done { background: #d7f5dd; color: #1d6b33; }
  #status { padding: 0 16px 16px; color: #666666; font-size: 14px; }
</style>
</head>
<body>
  <h1 id="title">placeholder</h1>
  <ul id="list"></ul>
  <p id="status">no-script</p>
  <script>
    // Regression guard for the Boa script path (default since the engine flip):
    // exercises textContent, createElement/appendChild, classList and
    // querySelectorAll. Under the legacy toy interpreter this stays as the
    // "placeholder / no-script" markup.
    document.getElementById('title').textContent = 'JS-driven DOM (Boa)';
    var items = ['alpha', 'beta', 'gamma'];
    var list = document.getElementById('list');
    for (var i = 0; i < items.length; i++) {
      var li = document.createElement('li');
      li.textContent = (i + 1) + '. ' + items[i];
      if (i % 2 === 1) { li.classList.add('done'); }
      list.appendChild(li);
    }
    document.getElementById('status').textContent =
      'rendered ' + list.querySelectorAll('li').length + ' items via script';
  </script>
</body>
</html>
